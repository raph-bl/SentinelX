# SupportDesk -- intentionally vulnerable application (pedagogical use only)
#
# WARNING: the full monitoring stack (Wazuh + Prometheus + Grafana) requires
# 8-12 GB of available RAM. Wazuh indexer (OpenSearch) alone needs ~4 GB heap.
# Check your machine resources before starting the complete stack.
# Wazuh can take 5-15 minutes to become fully operational after first start.

include:
  - wazuh/docker-compose.yml
services:
  supportdesk:
    build: .
    ports:
      - "3000:3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - PORT=3000
    restart: unless-stopped
    networks:
      - app-net
      - wazuh-net
    volumes:
      - app_logs:/var/log/supportdesk
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 3
  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - app-net
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    networks:
      - app-net
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      prometheus:
        condition: service_healthy
    

networks:
  app-net:
    driver: bridge
  wazuh-net:
    driver: bridge

volumes:
  filebeat_etc:
  filebeat_var:
  prometheus_data:
  grafana_data:
  app_logs:
